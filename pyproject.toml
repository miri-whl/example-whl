[project]
name = "tinystat"
version = "1.0.0"
description = "Small-sample statistics, and a demonstration of wheel layout"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "miri-whl" }]
keywords = ["packaging", "wheel", "importlib.resources", "example"]

# No runtime dependencies, deliberately. The failure this repository
# demonstrates needs nothing but the standard library, and a dependency
# would invite the reader to wonder whether it was implicated.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  # build.py reads this file for name and version. tomllib is stdlib
  # from 3.11; below that it needs the backport, or the build cannot
  # run on a Python the library itself supports.
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/miri-whl/example-whl"

# `build.py` reads name and version from this file rather than carrying
# its own copies, so there is one place to change them. It does NOT use
# a build backend: the whole point is to write both archives by hand, so
# that no tool can quietly correct the mistake being demonstrated. That
# is also why there is no [build-system] table — `pip install .` here
# would give you the good layout and hide the lesson.

[tool.pytest.ini_options]
# src layout: the unit tests import tinystat from source, without an
# install. That is the default a project gets for free, and part of what
# this repository is about — see tests/test_installed.py for what it
# misses.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "installed: builds real wheels and installs them into throwaway virtualenvs (slow)",
]
