name: Release

# A tag is the trigger, so cutting a release is one push and the tag is
# what the artifacts are named for. Nothing publishes from a branch.
on:
  push:
    tags: ["v*"]

# Creating a release and attaching assets needs write; nothing else does.
permissions:
  contents: write

# NOT PyPI, deliberately. One of these two wheels is engineered to raise
# FileNotFoundError, and putting it on an index means somebody can
# `pip install tinystat` and get it by accident. A GitHub release gives a
# reader the same artifact to poke at, from a URL that says what it is,
# without parking a broken package on the index everyone shares.

jobs:
  release:
    name: Build both wheels and attach them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      # The tag and the packaged version must agree, or the release is
      # named for something it does not contain. Checked before anything
      # is built, because afterwards the wrong artifact already exists.
      - name: Tag matches the packaged version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $packaged"
            exit 1
          fi
          echo "value=$packaged" >> "$GITHUB_OUTPUT"
          echo "releasing $packaged"

      # The gate. A release whose bad wheel had quietly started working
      # would ship a teaching artifact that teaches nothing.
      - name: Full suite, including the install round-trip
        run: python -m pytest

      - name: Build both wheels
        run: python build.py

      # Both wheels are tinystat-1.0.0-py3-none-any.whl — same
      # distribution, same version, same tags — and a release is a flat
      # list of files, so one would overwrite the other.
      #
      # The fix is the build tag: the optional fourth field of the wheel
      # filename, which exists to distinguish two builds of one version
      # and must begin with a digit. So the release carries
      # `1good` and `2bad`. Both remain valid, installable wheels; the
      # filename says which is which, and pip prefers the higher build
      # tag if someone points it at both, which is the good one by
      # construction of the numbering.
      - name: Name them apart, with the field the format provides
        run: |
          mkdir -p release
          cp dist/good/tinystat-*.whl "release/tinystat-${GITHUB_REF_NAME#v}-1good-py3-none-any.whl"
          cp dist/bad/tinystat-*.whl  "release/tinystat-${GITHUB_REF_NAME#v}-2bad-py3-none-any.whl"
          ls -l release

      # A reader who cannot verify the bytes is trusting the host.
      - name: Write SHA256SUMS
        working-directory: release
        run: |
          sha256sum *.whl > SHA256SUMS
          cat SHA256SUMS

      # Prove, in the release log, that the artifacts being attached are
      # the ones the README describes. Anyone reading the run can see the
      # broken wheel fail before it is published as a broken wheel.
      - name: Show the contrast in the log
        run: |
          for kind in 1good 2bad; do
            python -m venv "/tmp/$kind"
            "/tmp/$kind/bin/pip" install -q release/tinystat-*-"$kind"-*.whl
            echo "--- $kind ---"
            "/tmp/$kind/bin/python" -c "import tinystat; print('  mean       ', tinystat.mean([1, 2, 3]))"
            "/tmp/$kind/bin/python" -c "import tinystat; print('  t_critical ', tinystat.t_critical(10, 0.05))" \
              || echo "  t_critical  FileNotFoundError — which is what this wheel is for"
          done

      - uses: softprops/action-gh-release@aec2ec56f94eb8180ceec724245f64ef008b89f5 # v2.4.0
        with:
          files: |
            release/*.whl
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Two wheels built from one source tree. The Python inside them
            is byte-identical; they differ only in where the lookup table
            was placed.

            | file | layout | `t_critical()` |
            |---|---|---|
            | `…-1good-…whl` | table inside the import package | returns `2.228` |
            | `…-2bad-…whl` | table in the `.data` scheme | raises `FileNotFoundError` |

            Both are valid wheels and both install without a warning.

            ```bash
            pip install https://github.com/miri-whl/example-whl/releases/download/${{ github.ref_name }}/tinystat-${{ steps.version.outputs.value }}-2bad-py3-none-any.whl
            python -c "import tinystat; tinystat.t_critical(10)"
            ```

            Not published to PyPI on purpose — one of these is broken by
            design and does not belong on an index people install from.
